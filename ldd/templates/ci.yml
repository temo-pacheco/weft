# LDD CI gate — .github/workflows/ldd.yml
# One dependency: python3 (plus the weft binary). No bash, jq, or just.
# `ldd verify` runs the five gates in order and exits non-zero on the first
# failure: refs, sync, conformance, build, prose (the Prime Directive).
name: ldd-gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Build/install the weft binary (adjust to how your repo ships it).
      - name: Build weft
        run: make -C tools/weft && echo "$PWD/tools/weft" >> "$GITHUB_PATH"

      # The five gates. Set --build to your compile/test command.
      - name: LDD gates
        run: python3 ldd.py --main project.weft verify --build "make"
